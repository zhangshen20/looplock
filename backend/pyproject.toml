[project]
name = "looplock-agent"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "google-adk[gcp]>=2,<3",
  "google-cloud-firestore>=2.28,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.25,<5",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2"
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/looplock_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
